name: Build and Release PokemonEdge

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4

      - name: 🏷️ Extraer Configuración del Release
        id: config
        shell: pwsh
        run: |
          Write-Host "[LOG] Iniciando lectura de release_config.json..."
          $json = Get-Content release_config.json | ConvertFrom-Json
          Write-Host "[LOG] release_config.json leído con éxito."
          
          echo "TAG=$($json.configs.tag)" >> $env:GITHUB_ENV
          echo "REL_NAME=$($json.configs.name)" >> $env:GITHUB_ENV
          echo "DESC=$($json.configs.description)" >> $env:GITHUB_ENV
          echo "PRE=$($json.configs.prerelease.ToString().ToLower())" >> $env:GITHUB_ENV
          echo "LATEST=$($json.configs.make_latest.ToString().ToLower())" >> $env:GITHUB_ENV
          
          New-Item -ItemType Directory -Force -Path "app/data"
          $json.userjson | ConvertTo-Json | Out-File "app/data/version.json" -Encoding utf8
          $json.userjson | ConvertTo-Json | Out-File "version.json" -Encoding utf8
          Write-Host "[LOG] Configuración de entorno y versiones guardada correctamente."

      - name: 📥 Descargar Dependencias desde dependencies.json (Con Logs Detallados)
        shell: pwsh
        run: |
          Write-Host "[LOG] Paso de dependencias iniciado."
          if (-not (Test-Path "dependencies.json")) {
              Write-Error "[FATAL] El archivo dependencies.json no existe en la ruta raíz."
              exit 1
          }
          Write-Host "[LOG] Archivo dependencies.json encontrado. Parseando contenido..."
          
          $depConfig = Get-Content dependencies.json | ConvertFrom-Json
          Write-Host "[LOG] dependencies.json parseado correctamente a objeto PowerShell."

          # 1. Archivos individuales
          Write-Host "[LOG] --- INICIANDO SECCIÓN DE ARCHIVOS INDIVIDUALES ---"
          foreach ($fileEntry in @($depConfig.files)) {
              Write-Host "[LOG] Procesando archivo individual -> URL: $($fileEntry.url) | Destino: $($fileEntry.dest)"
              $targetDir = Split-Path $fileEntry.dest
              if ($targetDir -and -not (Test-Path$targetDir)) { 
                  Write-Host "[LOG] Creando directorio destino faltante: $targetDir"
                  New-Item -ItemType Directory -Force -Path $targetDir | Out-Null 
              }
              Write-Host "[LOG] Descargando con Invoke-WebRequest..."
              Invoke-WebRequest -Uri $fileEntry.url -OutFile$fileEntry.dest
              Write-Host "[LOG] Descarga completada para: $($fileEntry.dest)"
          }
          
          # 2. Archivos ZIP
          Write-Host "[LOG] --- INICIANDO SECCIÓN DE ARCHIVOS ZIP ---"
          foreach ($zipEntry in @($depConfig.zips)) {
              Write-Host "[LOG] Procesando ZIP -> URL: $($zipEntry.url) | Extracción: $($zipEntry.extract_path)"
              Write-Host "[LOG] Descargando archivo ZIP temporal..."
              Invoke-WebRequest -Uri $zipEntry.url -OutFile "temp_dl.zip"
              Write-Host "[LOG] Expandiendo archivo ZIP..."
              Expand-Archive -Path "temp_dl.zip" -DestinationPath $zipEntry.extract_path -Force
              
              foreach ($mappingKey in @($zipEntry.mappings.PSObject.Properties.Name)) {$destinationPath = $zipEntry.mappings.$mappingKey
                  Write-Host "[LOG] Mapeando ZIP: $mappingKey ->$destinationPath"
                  $destinationDir = Split-Path$destinationPath
                  if ($destinationDir -and -not (Test-Path$destinationDir)) { 
                      New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null 
                  }
                  Copy-Item -Path $mappingKey -Destination$destinationPath -Force
              }
              Write-Host "[LOG] Limpiando archivos temporales de ZIP..."
              Remove-Item "temp_dl.zip" -Force
              Remove-Item $zipEntry.extract_path -Recurse -Force
          }
          
          # 3. Repositorios Git
          Write-Host "[LOG] --- INICIANDO SECCIÓN DE REPOSITORIOS GIT ---"
          foreach ($gitEntry in @($depConfig.gits)) {
              Write-Host "[LOG] Procesando Git -> URL: $($gitEntry.url) | Carpeta temporal: $($gitEntry.temp_dir)"
              if (Test-Path $gitEntry.temp_dir) { 
                  Write-Host "[LOG] Eliminando directorio temporal existente previamente: $($gitEntry.temp_dir)"
                  Remove-Item $gitEntry.temp_dir -Recurse -Force 
              }
              Write-Host "[LOG] Ejecutando git clone --depth 1..."
              git clone --depth 1 $gitEntry.url $gitEntry.temp_dir
              
              foreach ($mappingKey in @($gitEntry.mappings.PSObject.Properties.Name)) {$destinationPath = $gitEntry.mappings.$mappingKey
                  Write-Host "[LOG] Mapeando Git: $mappingKey ->$destinationPath"
                  $destinationDir = Split-Path$destinationPath
                  if ($destinationDir -and -not (Test-Path$destinationDir)) { 
                      New-Item -ItemType Directory -Force -Path $destinationDir | Out-Null 
                  }
                  Copy-Item -Path $mappingKey -Destination$destinationPath -Force
              }
              Write-Host "[LOG] Limpiando directorio temporal Git: $($gitEntry.temp_dir)..."
              Remove-Item $gitEntry.temp_dir -Recurse -Force
          }
          Write-Host "[LOG] ¡Todas las dependencias se leyeron del JSON y se organizaron con éxito!"

      - name: 🔐 Cifrar Base de Datos usando Secret de GitHub
        shell: pwsh
        env:
          DB_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          $dbPath = "app/data/db/pokemonEdge.db"
          $keyVal = if ($env:DB_KEY) { [int]$env:DB_KEY } else { 90 }
          
          if (Test-Path $dbPath) {
              Write-Host "Cifrando base de datos para compilación con clave: $keyVal..."
              $bytes = [System.IO.File]::ReadAllBytes($dbPath)
              for ($i = 0; $i -lt$bytes.Length; $i++) {$bytes[$i] =$bytes[$i] -bxor$keyVal
              }
              [System.IO.File]::WriteAllBytes($dbPath,$bytes)
              Write-Host "Base de datos cifrada correctamente."
          } else {
              Write-Error "No se encontró el archivo de base de datos en $dbPath"
              exit 1
          }

      - name: 🔨 Compilar Motor con ImGui y DirectX 11 (Sin Consola)
        shell: cmd
        env:
          DB_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.X86.X64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )
          if "%VS_PATH%"=="" (
            echo Error: No se encontró Visual Studio con las herramientas de C++.
            exit /b 1
          )
          echo Usando Visual Studio en: "%VS_PATH%"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          
          rc.exe resources.rc
          
          dir /b /s app\*.cpp > sources.txt
          echo main.cpp >> sources.txt
          
          cl.exe /std:c++17 /EHsc /O2 /DXOR_KEY_VAL=%DB_KEY% /I app/utils/sqlite /I app/utils/imgui @sources.txt app/utils/sqlite/sqlite3.c resources.res /Fe:PokemonEdge.exe /link winhttp.lib shell32.lib user32.lib d3d11.lib dxgi.lib d3dcompiler.lib /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup

      - name: 🗂️ Preparar ZIP Final
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_build/app/data/db"
          
          Copy-Item -Path "PokemonEdge.exe" -Destination "release_build/"
          Copy-Item -Path "app/data/version.json" -Destination "release_build/app/data/version.json"
          if (Test-Path "app/data/logo.png") { Copy-Item -Path "app/data/logo.png" -Destination "release_build/app/data/" }

          Compress-Archive -Path "release_build/*" -DestinationPath "PokemonEdge.zip" -Force

      - name: 🔄 Restaurar Base de Datos Original en el Repo
        shell: pwsh
        run: |
          git checkout app/data/db/pokemonEdge.db

      - name: 🚀 Publicar en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.REL_NAME }}
          body: ${{ env.DESC }}
          prerelease: ${{ env.PRE == 'true' }}
          make_latest: ${{ env.LATEST == 'true' }}
          files: |
            PokemonEdge.zip
            version.json
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}