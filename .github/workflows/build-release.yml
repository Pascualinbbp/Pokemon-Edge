name: Build and Release PokemonEdge

# Orquestador: al subir a main lanza los trabajos en el orden que necesitan.
#   dependencias ─┬─> código de terceros ─┐
#   base de datos ────────────────────────┴─> compilar y publicar
# Cada trabajo vive en su propio fichero (ci-*.yml) y se puede reejecutar o corregir por separado.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  dependencies:
    uses: ./.github/workflows/ci-dependencies.yml

  database:
    uses: ./.github/workflows/ci-database.yml
    secrets: inherit

  thirdparty:
    needs: dependencies
    uses: ./.github/workflows/ci-thirdparty.yml

  build:
    needs: [ thirdparty, database ]
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit
    permissions:
      contents: write
