name: Build and Release PokemonEdge

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Código
        uses: actions/checkout@v4

      - name: 🏷️ Extraer Configuración del Release
        id: config
        shell: pwsh
        run: |
          $json = Get-Content release_config.json | ConvertFrom-Json
          
          echo "TAG=$($json.configs.tag)" >> $env:GITHUB_ENV
          echo "REL_NAME=$($json.configs.name)" >> $env:GITHUB_ENV
          echo "DESC=$($json.configs.description)" >> $env:GITHUB_ENV
          echo "PRE=$($json.configs.prerelease.ToString().ToLower())" >> $env:GITHUB_ENV
          echo "LATEST=$($json.configs.make_latest.ToString().ToLower())" >> $env:GITHUB_ENV
          
          New-Item -ItemType Directory -Force -Path "app/data"
          $json.userjson | ConvertTo-Json | Out-File "app/data/version.json" -Encoding utf8
          
          $json.userjson | ConvertTo-Json | Out-File "version.json" -Encoding utf8

      - name: 📥 Descargar Dependencias desde dependencies.json
        shell: pwsh
        run: |
          if (-not (Test-Path "dependencies.json")) {
              Write-Error "Fallo crítico: El archivo dependencies.json no existe en el repositorio."
              exit 1
          }
          $depConfig = Get-Content dependencies.json | ConvertFrom-Json
          
          foreach ($item in$depConfig.downloads) {
              Write-Host "Procesando recurso: $($item.url)"
              if ($item.type -eq 'file') {
                  $dir = Split-Path$item.dest
                  if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path$dir | Out-Null }
                  Invoke-WebRequest -Uri $item.url -OutFile$item.dest
              }
              elseif ($item.type -eq 'zip') {
                  Invoke-WebRequest -Uri $item.url -OutFile "temp_download.zip"
                  Expand-Archive -Path "temp_download.zip" -DestinationPath $item.temp_dir -Force
                  foreach ($f in$item.files) {
                      $dir = Split-Path$f.dest
                      if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path$dir | Out-Null }
                      Copy-Item -Path $f.src -Destination$f.dest -Force
                  }
                  Remove-Item "temp_download.zip" -Force
                  Remove-Item $item.temp_dir -Recurse -Force
              }
              elseif ($item.type -eq 'git') {
                  if (Test-Path $item.temp_dir) { Remove-Item$item.temp_dir -Recurse -Force }
                  git clone --depth 1 $item.url $item.temp_dir
                  foreach ($f in$item.files) {
                      $dir = Split-Path$f.dest
                      if ($dir -and -not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path$dir | Out-Null }
                      Copy-Item -Path $f.src -Destination$f.dest -Force
                  }
                  Remove-Item $item.temp_dir -Recurse -Force
              }
          }
          Write-Host "¡Todas las dependencias se descargaron y organizaron con éxito!"

      - name: 🔐 Cifrar Base de Datos usando Secret de GitHub
        shell: pwsh
        env:
          DB_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          $dbPath = "app/data/db/pokemonEdge.db"
          $keyVal = if ($env:DB_KEY) { [int]$env:DB_KEY } else { 90 }
          
          if (Test-Path $dbPath) {
              Write-Host "Cifrando base de datos para compilación con clave: $keyVal..."
              $bytes = [System.IO.File]::ReadAllBytes($dbPath)
              for ($i = 0; $i -lt$bytes.Length; $i++) {$bytes[$i] =$bytes[$i] -bxor$keyVal
              }
              [System.IO.File]::WriteAllBytes($dbPath,$bytes)
          } else {
              Write-Error "No se encontró el archivo de base de datos en $dbPath"
              exit 1
          }

      - name: 🔨 Compilar Motor con ImGui y DirectX 11 (Sin Consola)
        shell: cmd
        env:
          DB_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.X86.X64 -property installationPath`) do (
            set "VS_PATH=%%i"
          )
          if "%VS_PATH%"=="" (
            echo Error: No se encontró Visual Studio con las herramientas de C++.
            exit /b 1
          )
          echo Usando Visual Studio en: "%VS_PATH%"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          
          rc.exe resources.rc
          
          :: Recolectar automáticamente main.cpp y todos los .cpp dentro de la carpeta app (incluyendo GUI e ImGui)
          dir /b /s app\*.cpp > sources.txt
          echo main.cpp >> sources.txt
          
          cl.exe /std:c++17 /EHsc /O2 /DXOR_KEY_VAL=%DB_KEY% /I app/utils/sqlite /I app/utils/imgui @sources.txt app/utils/sqlite/sqlite3.c resources.res /Fe:PokemonEdge.exe /link winhttp.lib shell32.lib user32.lib d3d11.lib dxgi.lib d3dcompiler.lib /SUBSYSTEM:WINDOWS /ENTRY:mainCRTStartup

      - name: 🗂️ Preparar ZIP Final
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_build/app/data/db"
          
          Copy-Item -Path "PokemonEdge.exe" -Destination "release_build/"
          Copy-Item -Path "app/data/version.json" -Destination "release_build/app/data/version.json"
          if (Test-Path "app/data/logo.png") { Copy-Item -Path "app/data/logo.png" -Destination "release_build/app/data/" }

          Compress-Archive -Path "release_build/*" -DestinationPath "PokemonEdge.zip" -Force

      - name: 🔄 Restaurar Base de Datos Original en el Repo
        shell: pwsh
        run: |
          git checkout app/data/db/pokemonEdge.db

      - name: 🚀 Publicar en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.REL_NAME }}
          body: ${{ env.DESC }}
          prerelease: ${{ env.PRE == 'true' }}
          make_latest: ${{ env.LATEST == 'true' }}
          files: |
            PokemonEdge.zip
            version.json
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}